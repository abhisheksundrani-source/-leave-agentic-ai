<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .box { fill:#ffffff; stroke:#0b5fa5; stroke-width:2; rx:10; }
    .cloud { fill:#f3f9ff; stroke:#0b5fa5; stroke-width:1.5; rx:12; }
    .title { font: 16px/1.2 "Segoe UI Semibold", Arial, sans-serif; fill:#073b6b; }
    .small { font: 12px/1.2 "Segoe UI", Arial, sans-serif; fill:#0b2545; }
    .arrow { stroke:#0b5fa5; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    .note { font:11px "Segoe UI", Arial, sans-serif; fill:#234; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0b5fa5"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="40" y="40" width="260" height="100" class="box" />
  <text x="170" y="70" text-anchor="middle" class="title">User / Chatbot UI</text>
  <text x="170" y="95" text-anchor="middle" class="small">Web, Mobile, Teams, Slack</text>

  <!-- Orchestrator -->
  <rect x="360" y="30" width="360" height="120" class="box" />
  <text x="540" y="60" text-anchor="middle" class="title">MCP Orchestrator</text>
  <text x="540" y="85" text-anchor="middle" class="small">Workflow, routing, state, audit</text>

  <path d="M300 90 L360 90" class="arrow"/>

  <!-- Agents cloud -->
  <rect x="760" y="20" width="560" height="420" class="cloud" />
  <text x="1040" y="45" text-anchor="middle" class="title">Agents</text>
  <text x="1040" y="65" text-anchor="middle" class="small">Intake, Balance, Calendar, Policy, DocVerifier, Predictor, Submission</text>

  <!-- Agent boxes -->
  <rect x="800" y="90" width="240" height="80" class="box" />
  <text x="920" y="120" text-anchor="middle" class="small">Intake Agent</text>
  <text x="920" y="138" text-anchor="middle" class="small">Intent, slots, attachments</text>

  <rect x="1060" y="90" width="240" height="80" class="box" />
  <text x="1180" y="120" text-anchor="middle" class="small">Balance Validator</text>
  <text x="1180" y="138" text-anchor="middle" class="small">HRIS queries</text>

  <rect x="800" y="190" width="240" height="80" class="box" />
  <text x="920" y="220" text-anchor="middle" class="small">Calendar Analyzer</text>
  <text x="920" y="238" text-anchor="middle" class="small">Free/busy, conflicts, releases</text>

  <rect x="1060" y="190" width="240" height="80" class="box" />
  <text x="1180" y="220" text-anchor="middle" class="small">Policy Engine</text>
  <text x="1180" y="238" text-anchor="middle" class="small">OPA / Drools rules</text>

  <rect x="800" y="290" width="240" height="80" class="box" />
  <text x="920" y="320" text-anchor="middle" class="small">Doc Verifier</text>
  <text x="920" y="338" text-anchor="middle" class="small">OCR + classifier</text>

  <rect x="1060" y="290" width="240" height="80" class="box" />
  <text x="1180" y="320" text-anchor="middle" class="small">Predictor</text>
  <text x="1180" y="338" text-anchor="middle" class="small">Approval probability, impact</text>

  <path d="M720 90 L800 130" class="arrow"/>
  <path d="M720 90 L1060 130" class="arrow"/>
  <path d="M720 90 L800 230" class="arrow"/>
  <path d="M720 90 L1060 230" class="arrow"/>
  <path d="M720 90 L800 330" class="arrow"/>
  <path d="M720 90 L1060 330" class="arrow"/>

  <!-- RAG -->
  <rect x="40" y="180" width="300" height="140" class="box" />
  <text x="190" y="205" text-anchor="middle" class="title">RAG / Vector DB</text>
  <text x="190" y="225" text-anchor="middle" class="small">Policy docs, past cases, FAQs</text>

  <path d="M340 250 L800 250" class="arrow"/>

  <!-- HRIS and Calendars -->
  <rect x="40" y="360" width="300" height="140" class="box" />
  <text x="190" y="390" text-anchor="middle" class="title">HRIS / Payroll</text>
  <text x="190" y="410" text-anchor="middle" class="small">Workday / SuccessFactors / ADP</text>

  <rect x="360" y="360" width="300" height="140" class="box" />
  <text x="510" y="390" text-anchor="middle" class="title">Calendars & Tools</text>
  <text x="510" y="410" text-anchor="middle" class="small">Google / Outlook / Jira / Asana</text>

  <path d="M1040 360 L660 360" class="arrow"/>
  <path d="M1180 360 L660 360" class="arrow"/>

  <!-- Submission -->
  <rect x="760" y="460" width="560" height="120" class="cloud" />
  <text x="1040" y="490" text-anchor="middle" class="title">Submission & Notifications</text>
  <text x="1040" y="510" text-anchor="middle" class="small">HRIS write, manager notify, calendar hold</text>

  <path d="M1040 370 L1040 460" class="arrow"/>

  <!-- Monitoring -->
  <rect x="40" y="540" width="300" height="120" class="box" />
  <text x="190" y="570" text-anchor="middle" class="title">Monitoring & Audit</text>
  <text x="190" y="590" text-anchor="middle" class="small">Prometheus / Grafana / ELK</text>

  <path d="M1040 520 L200 540" class="arrow"/>

  <!-- Legend -->
  <rect x="1160" y="600" width="220" height="220" rx="8" fill="#fff" stroke="#cbd5e1" />
  <text x="1270" y="630" class="title" text-anchor="middle">Legend</text>
  <text x="1190" y="660" class="note">Blue boxes: services</text>
  <text x="1190" y="680" class="note">Cloud: agent group</text>
  <text x="1190" y="700" class="note">Arrows: data / control flow</text>
</svg>
